<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Mir00r</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #frame {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scaleX(-1);
      }

      #status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 13px system-ui, sans-serif;
        color: #eee;
        background: rgba(0, 0, 0, 0.6);
        text-align: center;
        padding: 8px;
        box-sizing: border-box;
      }

      #status.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <video id="cam" autoplay muted playsinline></video>
      <div id="status" class="hidden"></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
